# IPSC2-MONITOR — per-master sidecar for a RYSEN / System X instance.

[RYSEN]
HOST = 127.0.0.1
PORT = 4321

[WEB]
HOST = 0.0.0.0
PORT = 8088
# uk (default) or de — browser can still toggle
THEME = de

[SITE]
TITLE = System X
CONTACT_NAME =
CONTACT_COUNTRY = United Kingdom
CONTACT_EMAIL =
LASTHEARD_ROWS = 70
# Leave blank if this master has no selfcare
SELFCARE_URL = /dashboard/sslogin.php

[FILES]
# Optional alias files (RadioID / HBlink shapes). Leave blank to skip.
PATH = ./data
PEER_FILE = peer_ids.json
SUBSCRIBER_FILE = user.csv
TGID_FILE = talkgroup_ids.json

[LOGGER]
LEVEL = INFO
