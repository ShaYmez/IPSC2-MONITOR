<html lang="en" data-theme="de" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>System X Dashboard</title>
  <script>
    (function () {
      var saved = localStorage.getItem("ipsc2-dash-mode");
      var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-mode", saved || (dark ? "dark" : "light"));
    }());
  </script>
  <link rel="stylesheet" href="css/ipsc2.css">
</head>
<body>
  <div id="wrapper">
    <div id="header">
      <table class="main">
        <tr>
          <th id="site-title">System X</th>
        </tr>
        <tr>
          <td class="accent-bar"></td>
        </tr>
      </table>
    </div>

    <div id="content_nav">
      <table class="map" id="map">
        <tr>
          <td>
            <a href="#status" data-page="status">STATUS</a>
            <a href="#monitor" data-page="monitor">MONITOR</a>
            <a href="#matrix" data-page="matrix">MATRIX</a>
            <a href="#remap" data-page="remap">REMAP</a>
            <a href="#bridge" data-page="bridge">BRIDGE</a>
            <a href="#dongle" data-page="dongle">APP</a>
            <a href="#service" data-page="service">SERVICE</a>
            <a href="#selfcare" data-page="selfcare">SELFCARE</a>
            <a href="#siteinfo" data-page="siteinfo">SITE-INFO</a>
          </td>
        </tr>
      </table>
      <div class="nav-credit">
        <div class="nav-credit-text">
          <p class="nav-brand">
            <span>System X</span>
            <span>RYSEN</span>
          </p>
          <p class="nav-calls">M0VUB</p>
        </div>
        <div class="nav-toggles">
          <button type="button" id="theme-toggle" title="Switch UK / DE colours">DE</button>
          <button type="button" id="mode-toggle" title="Light mode" aria-label="Light mode">
            <svg class="mode-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.2v1.8M8 13v1.8M1.2 8h1.8M13 8h1.8M3.1 3.1l1.3 1.3M11.6 11.6l1.3 1.3M3.1 12.9l1.3-1.3M11.6 4.4l1.3-1.3"/></svg>
            <svg class="mode-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M11.2 10.6A5.4 5.4 0 0 1 6.4 3.4 5.8 5.8 0 1 0 12.6 11a5.2 5.2 0 0 1-1.4-.4z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="mainpage"></div>

    <div id="footer">
      <table class="bottom">
        <tr>
          <td class="accent-bar"></td>
        </tr>
        <tr>
          <th id="footer-line">System X</th>
        </tr>
      </table>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
