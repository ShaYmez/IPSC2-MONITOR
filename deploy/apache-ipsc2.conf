# Reverse-proxy the IPSC2-MONITOR sidecar. Include from the System X vhost.
# The existing /dashboard/ AdminLTE UI is unchanged.

RedirectMatch ^/legacy$ /legacy/
ProxyPreserveHost On
ProxyPass /legacy/ http://127.0.0.1:8088/
ProxyPassReverse /legacy/ http://127.0.0.1:8088/
